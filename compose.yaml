services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-studyflow}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-StudyFlow API}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-studyflow}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-flash-latest}
      AI_RATE_LIMIT_PER_DAY: ${AI_RATE_LIMIT_PER_DAY:-300}
      TTS_RATE_LIMIT_PER_DAY: ${TTS_RATE_LIMIT_PER_DAY:-500}
      LOGIN_RATE_LIMIT_PER_15_MIN: ${LOGIN_RATE_LIMIT_PER_15_MIN:-240}
      FAILED_LOGIN_LIMIT: ${FAILED_LOGIN_LIMIT:-20}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      REGISTRATION_RATE_LIMIT_PER_DAY: ${REGISTRATION_RATE_LIMIT_PER_DAY:-40}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  lan-https:
    image: caddy:2-alpine
    profiles: ["lan"]
    environment:
      LAN_HOST: ${LAN_HOST:-localhost}
      LAN_HTTPS_PORT: ${LAN_HTTPS_PORT:-8443}
    ports:
      - "${LAN_HTTPS_PORT:-8443}:${LAN_HTTPS_PORT:-8443}"
    volumes:
      - ./docker/Caddyfile.lan:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped

  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: studyflow_test
      POSTGRES_PASSWORD: studyflow_test
      POSTGRES_DB: studyflow_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyflow_test -d studyflow_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["test"]
    entrypoint: ["python", "-m", "pytest", "tests", "-q"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://studyflow_test:studyflow_test@db-test:5432/studyflow_test
      JWT_SECRET_KEY: test-secret-key-with-at-least-32-characters
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
